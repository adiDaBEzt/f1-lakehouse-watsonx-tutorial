<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&amp;family=IBM+Plex+Sans:wght@300;400;600&amp;display=block');
      .eyebrow { font: 500 22px 'IBM Plex Mono', Menlo, monospace; letter-spacing: 3px; fill: #78a9ff; }
      .title   { font: 300 104px 'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif; fill: #ffffff; letter-spacing: -2px; }
      .sub     { font: 400 28px 'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif; fill: #c6c6c6; }
      .chip    { font: 600 18px 'IBM Plex Mono', Menlo, monospace; letter-spacing: 2px; }
      .tag     { font: 500 16px 'IBM Plex Mono', Menlo, monospace; letter-spacing: 2px; fill: #a6c8ff; }
    </style>
    <radialGradient id="bg" cx="72%" cy="45%" r="80%">
      <stop offset="0" stop-color="#0a2a6e"/>
      <stop offset="0.55" stop-color="#061b47"/>
      <stop offset="1" stop-color="#020c24"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <pattern id="flag" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect width="16" height="16" fill="#ffffff"/>
      <rect width="8" height="8" fill="#161616"/>
      <rect x="8" y="8" width="8" height="8" fill="#161616"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <path id="lap" d="M 905 650 C 905 770 1100 790 1245 725 C 1385 662 1505 705 1525 600 C 1545 482 1425 440 1362 362 C 1300 288 1428 236 1385 168 C 1342 104 1176 112 1118 196 C 1062 278 1002 304 938 262 C 858 210 772 302 815 395 C 856 482 905 522 905 650 Z"/>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>

  <!-- Circuit: asphalt, then the racing line in three timing sectors -->
  <use href="#lap" fill="none" stroke="#1a3a80" stroke-opacity="0.75" stroke-width="46" stroke-linejoin="round"/>
  <use href="#lap" fill="none" stroke="#5b7fcf" stroke-opacity="0.45" stroke-width="2" stroke-dasharray="14 12"/>
  <path d="M 905 650 C 905 770 1100 790 1245 725 C 1385 662 1505 705 1525 600 C 1545 482 1425 440 1362 362 C 1300 288 1428 236 1385 168 C 1342 104 1176 112 1118 196 C 1062 278 1002 304 938 262 C 858 210 772 302 815 395 C 856 482 905 522 905 650 Z"
        pathLength="300" fill="none" stroke="#d08a47" stroke-width="10" stroke-linecap="round" stroke-dasharray="96 204" stroke-dashoffset="0" filter="url(#glow)"/>
  <path d="M 905 650 C 905 770 1100 790 1245 725 C 1385 662 1505 705 1525 600 C 1545 482 1425 440 1362 362 C 1300 288 1428 236 1385 168 C 1342 104 1176 112 1118 196 C 1062 278 1002 304 938 262 C 858 210 772 302 815 395 C 856 482 905 522 905 650 Z"
        pathLength="300" fill="none" stroke="#dde1e6" stroke-width="10" stroke-linecap="round" stroke-dasharray="96 204" stroke-dashoffset="-100" filter="url(#glow)"/>
  <path d="M 905 650 C 905 770 1100 790 1245 725 C 1385 662 1505 705 1525 600 C 1545 482 1425 440 1362 362 C 1300 288 1428 236 1385 168 C 1342 104 1176 112 1118 196 C 1062 278 1002 304 938 262 C 858 210 772 302 815 395 C 856 482 905 522 905 650 Z"
        pathLength="300" fill="none" stroke="#f1c21b" stroke-width="10" stroke-linecap="round" stroke-dasharray="96 204" stroke-dashoffset="-200" filter="url(#glow)"/>

  <!-- Start/finish line -->
  <rect x="880" y="626" width="50" height="16" fill="url(#flag)"/>

  <!-- Pit lane: the live Kafka stream joining the circuit -->
  <path d="M 520 820 C 700 820 820 790 880 720" fill="none" stroke="#4589ff" stroke-width="3" stroke-dasharray="2 14" stroke-linecap="round"/>
  <g fill="#78a9ff">
    <circle cx="560" cy="820" r="6"/><circle cx="620" cy="819" r="6"/><circle cx="680" cy="815" r="6" opacity="0.9"/>
    <circle cx="740" cy="807" r="6" opacity="0.85"/><circle cx="795" cy="794" r="6" opacity="0.8"/><circle cx="843" cy="770" r="6" opacity="0.75"/>
  </g>
  <text x="520" y="860" class="tag">LIVE · KAFKA</text>

  <!-- Sector labels -->
  <text x="1190" y="812" class="chip" fill="#d08a47">S1 · BRONZE</text>
  <text x="1420" y="300" class="chip" fill="#dde1e6">S2 · SILVER</text>
  <text x="700" y="250" class="chip" fill="#f1c21b">S3 · GOLD</text>

  <!-- Words -->
  <text x="96" y="150" class="eyebrow">WATSONX.DATA · CONFLUENT · WATSONX ORCHESTRATE</text>
  <text x="90" y="300" class="title">Real-time</text>
  <text x="90" y="410" class="title">medallion</text>
  <text x="90" y="520" class="title">lakehouse</text>
  <text x="96" y="600" class="sub">75 years of Formula 1. One SQL query across</text>
  <text x="96" y="642" class="sub">Iceberg, Kafka and PostgreSQL. One AI analyst.</text>
</svg>
